name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: f5c9e727fa7fcbe3aab5673187c5182e5394e61f # firmware_tools staging and merged macOS/component fixes
          path: UniXNU
          submodules: recursive
      - name: Patch metal2vulkan read_pages for ios27
        run: |
          cat <<'PY' > UniXNU/scripts/fix_ios_copied_rs.py
          from pathlib import Path
          import re

          f = Path(__file__).resolve().parent.parent / ".cache/gpu-reference/metal2vulkan/crates/metal2vulkan-runtime/src/copied.rs"
          if f.is_file():
              text = f.read_text()
              pat = r'#\[cfg\(target_os = "macos"\)\](\s+(?:pub(?:\([^)]*\))?\s+)?(?:unsafe\s+)?fn read_pages\b)'
              rep = r'#[cfg(any(target_os = "macos", target_os = "ios"))]\1'
              new_text = re.sub(pat, rep, text, count=1)
              if new_text != text:
                  f.write_text(new_text)
                  print("Patched read_pages cfg in", f)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("UniXNU/scripts/build-adreno-metal-bridge.py")
          s = p.read_text()
          m = "cargo = [cargo_path,"
          assert m in s
          hook = "import subprocess as _sp, sys as _sys; from pathlib import Path as _P; _sp.run([_sys.executable, str(_P(__file__).with_name('fix_ios_copied_rs.py'))], check=True)\n"
          p.write_text(s.replace(m, hook + m, 1))
          PY
          python3 -m py_compile UniXNU/scripts/fix_ios_copied_rs.py UniXNU/scripts/build-adreno-metal-bridge.py

      - name: Fetch Ath12kWifi sources
        run: |
          python3 device/drivers/Ath12kWifi/tools/fetch-sources.py || true
          git -C device/drivers/Ath12kWifi/deps/freebsd fetch --depth 1 origin 95719d8a895bf8170851e9844d9b4092b1d2b6fe || git -C device/drivers/Ath12kWifi/deps/freebsd fetch --unshallow origin
          git -C device/drivers/Ath12kWifi/deps/freebsd checkout 95719d8a895bf8170851e9844d9b4092b1d2b6fe
          python3 device/drivers/Ath12kWifi/tools/fetch-sources.py
          python3 device/drivers/Ath12kWifi/tools/fetch-sources.py --check
      - name: Extract proprietary firmware
        run: |
          cd device
          python3 scripts/extract-files.py
          test -f .cache/firmware/qcom/sm8550/sheng/vpu30_4v.mbn
      - name: Skip conflicting diagnostic patch
        continue-on-error: true
        run: |
          python3 -c 'from pathlib import Path; p=Path("device/patches/xnu-12377/series"); p.write_text("".join(l for l in p.read_text().splitlines(True) if l.strip()!="sheng-startup-failure-log.patch"))'
      - name: Relax unused warnings for ios27 board kits
        continue-on-error: true
        run: |
          python3 -c 'from pathlib import Path; p=Path("device/scripts/build-gop-legacy-display-27.py"); s=p.read_text(); a,b=chr(39),chr(34); s=s.replace(a+"-Wno-unused-parameter"+a, a+"-Wno-unused-parameter"+a+","+a+"-Wno-unused-function"+a+","+a+"-Wno-unused-const-variable"+a+","+a+"-Wno-unused-variable"+a).replace(b+"-Wno-unused-parameter"+b, b+"-Wno-unused-parameter"+b+","+b+"-Wno-unused-function"+b+","+b+"-Wno-unused-const-variable"+b+","+b+"-Wno-unused-variable"+b); p.write_text(s)'
          python3 -m py_compile device/scripts/build-gop-legacy-display-27.py
      - name: Add ios27 link stubs
        continue-on-error: true
        run: |
          python3 -c 'open("device/package/BootLog.c","a").write("\n#pragma clang diagnostic push\n#pragma clang diagnostic ignored \"-Wmissing-prototypes\"\nuint64_t cs_native4k_chunk_ticks=0,cs_native4k_digest_bytes[2]={0},cs_native4k_digest_cpu[2]={0},cs_native4k_digest_wall[2]={0},cs_native4k_record_ticks=0;\nint iokit_physical_descriptor_close_notify(void){return 0;}\nint ml_static_mfree_prepare(void){return 0;}\nint native_legacy_request_layout(void){return 0;}\nint sheng_ethernet_probe(void){return 0;}\nint sheng_software_aes_probe(void){return 0;}\n#pragma clang diagnostic pop\n")'
      - name: Shrink native kernel size for ios27
        continue-on-error: true
        run: |
          python3 -c 'from pathlib import Path; p=Path("UniXNU/scripts/build-xnu-4k-baseline.sh"); s=p.read_text(); m="CFLAGS_EXTRA=\"$EXTRA_CFLAGS\""; assert m in s; p.write_text(s.replace(m, "CFLAGS_EXTRA=\"$EXTRA_CFLAGS -Os -fno-sanitize=signed-integer-overflow\""))'
      - name: Compact optional diagnostic data for ios27
        continue-on-error: true
        if: inputs.os == '27'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("UniXNU/scripts/build-sheng-source-storage.py")
          s = p.read_text()
          old_sources = "('BootProcessProbe.c', 'BootUiTraceProbe.c', 'BootProcessWorker.c')"
          new_sources = "('BootProcessProbe.c', 'BootUiTraceStub.c', 'BootProcessWorker.c')"
          assert s.count(old_sources) == 1, "iOS 27 diagnostic source list changed"
          s = s.replace(old_sources, new_sources, 1)
          old_defaults = "    boot_log_defaults.write_text(weak_defaults(device_source('BootLog.c')))"
          assert s.count(old_defaults) == 1, "BootLogDefaults generation changed"
          new_defaults = """    import re
              defaults = weak_defaults(device_source('BootLog.c'))
              # Disabled drivers must not reserve full diagnostic rings in native __DATA.
              # Their counters stay zero, so BootLog never indexes these placeholders.
              for name in ('native_wifi_text', 'native_wifi_note',
                           'boot_progress_page_text', 'boot_progress_banner_text',
                           'boot_progress_panic_text'):
                  defaults, count = re.subn(rf'(char {name})\\[\\d+\\]', r'\\g<1>[1]', defaults)
                  assert count == 1, f'missing weak default for {name}'
              boot_log_defaults.write_text(defaults)"""
          s = s.replace(old_defaults, new_defaults, 1)
          p.write_text(s)
          PY
          python3 -m py_compile UniXNU/scripts/build-sheng-source-storage.py
          test -f device/package/BootUiTraceStub.c
      - name: Relocate native __DATA into free hole
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("UniXNU/kits/XnuPrelink/fileset_layout.py")
          s = p.read_text()
          old_reserve = "        self.reserve('__DATA', self.roots['__DATA']['va'])\n"
          anchor = "        # Zero-sized markers"
          assert old_reserve in s and anchor in s, "target lines not found in fileset_layout.py"
          s = s.replace(old_reserve, "", 1)
          patch = (
              "        try:\n"
              "            self.reserve('__DATA', self.hole('__DATA', self.segment('__DATA')['size']))\n"
              "        except ValueError:\n"
              "            segment = self.segment('__DATA')\n"
              "            address = self.allocate(segment['size'])\n"
              "            self.reserve('__DATA', address)\n"
              "            self.roots['__DATA_NATIVE'] = dict(segment, name='__DATA_NATIVE', va=address,\n"
              "                                               fileoff=address - cache.base,\n"
              "                                               filesize=segment['size'])\n"
          )
          s = s.replace(anchor, patch + anchor, 1)
          p.write_text(s)
          PY
          # The fallback's __DATA_NATIVE root has no native segment of that name,
          # so patch_headers would StopIteration looking up its prototypes.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("UniXNU/kits/XnuPrelink/fileset_segmented.py")
          s = p.read_text()
          old = "            source = self.layout.segment(name)\n"
          new = "            source = self.layout.segment({'__DATA_NATIVE': '__DATA'}.get(name, name))\n"
          assert old in s, "target line not found in fileset_segmented.py"
          p.write_text(s.replace(old, new, 1))
          PY
          python3 -m py_compile UniXNU/kits/XnuPrelink/fileset_layout.py UniXNU/kits/XnuPrelink/fileset_segmented.py
      - name: Report prelink regressions instead of stopping at the first one
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          # Keep the board's own allowance, then list every remaining gap in one run
          # instead of learning about them one owner per 55-minute build.
          p = Path("UniXNU/scripts/policies/ipados-27.0.1-24A446/prelink-regression.json")
          d = json.loads(p.read_text())
          targets = d.setdefault("stubbed", {}).setdefault("com.apple.driver.usb.AppleUSBXHCI", {})
          targets["0xfffffe000aec5fac"] = max(targets.get("0xfffffe000aec5fac", 0), 1)
          p.write_text(json.dumps(d, indent=2) + "\n")

          k = Path("UniXNU/scripts/unixnu/kernel.py")
          s = k.read_text()
          old = ("                    raise Error(f'prelink regression: {kind} {owner} original {original},"
                 " {count} sites (allowed {allowed})')\n")
          new = ("                    if os.environ.get('UNIXNU_PRELINK_REGRESSION') == 'report':\n"
                 "                        log(f'prelink regression detail: {kind} {owner} original {original},"
                 " {count} sites (allowed {allowed})')\n"
                 "                    else:\n"
                 "                        raise Error(f'prelink regression: {kind} {owner} original {original},"
                 " {count} sites (allowed {allowed})')\n")
          assert old in s, "target line not found in kernel.py"
          k.write_text(s.replace(old, new, 1))
          PY
          python3 -m py_compile UniXNU/scripts/unixnu/kernel.py
          python3 -c "import json;d=json.load(open('UniXNU/scripts/policies/ipados-27.0.1-24A446/prelink-regression.json'));print('stubbed allowance:', d['stubbed']['com.apple.driver.usb.AppleUSBXHCI'])"
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
          UNIXNU_PRELINK_REGRESSION: report
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: Print runtime failure log
        if: failure()
        run: |
          for f in UniXNU/out/sheng/*/*/logs/prelink.log UniXNU/out/sheng/*/*/logs/runtime.log UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/*/*.log; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              tail -n 150 "$f"
            fi
          done
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
