name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

# Queue mode: a later run on the same ref waits for the in-progress run instead of
# cancelling it. To change inputs mid-flight, cancel the old run by hand, then dispatch.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - name: update Ath12kWifi and ShengNovatekTouch submodules
        run: |
          git -C device/drivers/Ath12kWifi fetch --depth 1 origin f087c7d || git -C device/drivers/Ath12kWifi fetch origin
          git -C device/drivers/Ath12kWifi checkout f087c7d
          git -C device/drivers/ShengNovatekTouch fetch --depth 1 origin 988239b || git -C device/drivers/ShengNovatekTouch fetch origin
          git -C device/drivers/ShengNovatekTouch checkout 988239b
          git -C device/drivers/Ath12kWifi rev-parse HEAD
          git -C device/drivers/ShengNovatekTouch rev-parse HEAD
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 630b85a307f19c8d8a4699d5bfc12f6796b874aa # archive providers, RELEASE reference and firmware toolchain fixes
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: display power state request
        # The GOP scanout has no panel power switch, so the owned legacy display backend has to
        # answer the original display state request (slot 375) itself: mirror the requested word
        # into the powered word in both directions. Without it an off request never completes and
        # every later power-button press re-issues "off": the panel stays dark until a reboot.
        run: |
          python3 device/scripts/apply-state-request.py
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: pin FreeBSD source to p6 tag
        # releng/15.1 moves forward and drifts ahead of the locked commit; point
        # the locked ref at the immutable release/15.1.0-p6 tag that resolves
        # to commit 95719d8a895b..., keeping the FreeBSD source identity fixed.
        run: |
          python3 - <<'PY'
          import pathlib
          lock = pathlib.Path('device/drivers/Ath12kWifi/tools/source-lock.json')
          text = lock.read_text()
          if 'releng/15.1' in text:
              lock.write_text(text.replace('releng/15.1', 'release/15.1.0-p6'))
          PY
      - name: wifi sources
        # prepare-supplicant.py only runs fetch-sources.py --check, so the locked
        # Linux, FreeBSD and supplicant trees are fetched once here.
        run: |
          python3 device/drivers/Ath12kWifi/tools/fetch-sources.py
      - name: proprietary firmware
        # extract-files.py fills .cache/firmware from the pinned public mirror
        # (Touch / Keyboard / Video). The GOP legacy display archive and the
        # video firmware stage verify these pinned images and fail if absent.
        run: |
          python3 device/scripts/extract-files.py
      - name: patch bridge translator for iOS read_pages
        # Upstream read_pages compiles only for linux/macos/windows; the ios27 bridge
        # (target_os=ios) gets no definition and metal2vulkan-runtime fails E0425.
        # Upgrade the copied.rs cfg to macos+ios right around the cargo build, then
        # restore the file so later bridge invocations see the pristine source tree.
        run: |
          python3 - <<'PY'
          import pathlib
          bridge = pathlib.Path('UniXNU/scripts/build-adreno-metal-bridge.py')
          lines = bridge.read_text().splitlines()
          # locate the cargo build under `with log.open('w') as stream:`
          ci = None
          for i, ln in enumerate(lines):
              if ln.strip() == "with log.open('w') as stream:" and i + 1 < len(lines) and 'subprocess.run(cargo' in lines[i + 1]:
                  ci = i
                  break
          assert ci is not None, 'cargo build block not found in build-adreno-metal-bridge.py'
          # locate the returncode guard right after it
          fi = None
          for j in range(ci, min(ci + 8, len(lines))):
              if lines[j].strip() == 'if result.returncode:':
                  fi = j
                  break
          assert fi is not None and lines[fi + 1].strip().startswith('raise SystemExit'), 'returncode guard not found'
          upgrade = [
              "# sheng/iOS: upstream read_pages compiles only for linux/macos/windows, so the",
              "# ios27 bridge (target_os=ios) has no definition and metal2vulkan-runtime fails E0425.",
              "# Reuse the macOS Mach page-read path on iOS for this cargo build, then restore the file.",
              "_rt_file = SOURCE / 'crates/metal2vulkan-runtime/src/copied.rs'",
              "_rt_orig = _rt_file.read_text()",
              "_rt_lines = _rt_orig.splitlines()",
              "_rt_hit = None",
              "for _rt_n, _rt_line in enumerate(_rt_lines):",
              "    if _rt_line.strip() == '#[cfg(target_os = \"macos\")]' and _rt_n + 1 < len(_rt_lines) and 'read_pages' in _rt_lines[_rt_n + 1]:",
              "        _rt_hit = _rt_n",
              "        break",
              "if _rt_hit is not None:",
              "    _rt_lines[_rt_hit] = '#[cfg(any(target_os = \"macos\", target_os = \"ios\"))]'",
              "    _rt_file.write_text(chr(10).join(_rt_lines) + chr(10))",
              "elif '#[cfg(any(target_os = \"macos\", target_os = \"ios\"))]' not in _rt_orig:",
              "    raise SystemExit('read_pages macOS cfg anchor not found in copied.rs')",
          ]
          restore = [
              "if _rt_hit is not None:",
              "    _rt_file.write_text(_rt_orig)",
          ]
          lines[fi + 2:fi + 2] = restore
          lines[ci:ci] = upgrade
          patched = chr(10).join(lines) + chr(10)
          compile(patched, str(bridge), 'exec')
          bridge.write_text(patched)
          print('PASS: bridge patched for iOS read_pages (%d upgrade lines, %d restore lines)' % (len(upgrade), len(restore)))
          PY
      - name: patch fileset reference relink loop
        # The comparison kernel force-loads device archives whose bring-up hooks are
        # undefined for the generic BCM2837 RELEASE config (arm64e link rejects them).
        # Extend the existing stub mechanism: stub every symbol the relink still misses.
        run: |
          python3 - <<'PY'
          import pathlib
          script = pathlib.Path('UniXNU/scripts/build-fileset-release-reference.py')
          text = script.read_text()
          if 'RELEASE reference stub relink loop' in text:
              raise SystemExit(0)
          anchor = chr(10).join([
              "    if result.returncode:",
              "        raise SystemExit(result.returncode)",
          ]) + chr(10)
          assert text.count(anchor) == 1, 'RELEASE reference tail anchor count: %d' % text.count(anchor)
          repl = chr(10).join([
              "    # RELEASE reference stub relink loop: stub remaining undefined symbols, relink.",
              "    attempts = 0",
              "    while result.returncode and attempts < 3:",
              "        attempts += 1",
              "        log_text = (output / f'{mode}-build.log').read_text()",
              "        referenced = sorted(set(re.findall(r'^  \"(_[A-Za-z0-9_.]+)\", referenced from:', log_text, re.M)))",
              "        stubs_file = output / 'native-stubs.c'",
              "        known = set(re.findall(r'^long ([A-Za-z0-9_]+);', stubs_file.read_text(), re.M)) if stubs_file.exists() else set()",
              "        pending = [name for name in referenced if name[1:] not in known]",
              "        if not pending:",
              "            raise SystemExit(result.returncode)",
              "        known.update(name[1:] for name in pending)",
              "        stubs_file.write_text(''.join('long ' + name + ';' + chr(10) for name in sorted(known)))",
              "        sdk_path = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-path'], text=True).strip()",
              "        subprocess.run(['xcrun', 'clang', '-arch', 'arm64e', '-mkernel', '-isysroot', sdk_path, '-c',",
              "                        '-o', str(output / 'native-stubs.o'), str(stubs_file)], check=True)",
              "        if not any(a.startswith('LD_KERNEL_ARCHIVES=') and 'native-stubs.o' in a for a in args):",
              "            at = next(i for i, a in enumerate(args) if a.startswith('LD_KERNEL_ARCHIVES='))",
              "            args[at] += f' -Wl,-force_load,{output}/native-stubs.o'",
              "        with (output / f'{mode}-build.log').open('a') as log:",
              "            result = subprocess.run(args, cwd=root, env=env, stdout=log, stderr=subprocess.STDOUT)",
              "        print('RELEASE reference exit', result.returncode, 'log', output / f'{mode}-build.log', flush=True)",
              "    if result.returncode:",
              "        raise SystemExit(result.returncode)",
          ]) + chr(10)
          text = text.replace(anchor, repl, 1)
          compile(text, str(script), 'exec')
          script.write_text(text)
          print('PASS: fileset reference relink loop installed (%d lines)' % len(repl.splitlines()))
          PY
      - name: patch 4k baseline to link ios hook stubs
        # The extras block of build-xnu-4k-baseline.sh (device archives, probes and
        # ${XNU_EXTRA_LD_ARCHIVES}) only runs when BOOTSTRAP = 0, but the failing link is
        # the bootstrap pass of archive-20, so an environment-only archive never reached
        # it. Append the feature-absent provider archive inside the script instead, in
        # every mode, so the bootstrap pass resolves the same hooks.
        run: |
          python3 - <<'PY'
          import pathlib
          script = pathlib.Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          text = script.read_text()
          if 'ios-hook-stubs' in text:
              raise SystemExit(0)
          anchor = chr(10).join([
              '  EXTRA_MAKE_ARGS+=("LD_KERNEL_ARCHIVES=$KERNEL_EXTRA_ARCHIVES")',
              '  EXTRA_MAKE_ARGS+=("XNU_EXTERNAL_KERNEL_ARCHIVES=$KERNEL_ARCHIVE_DEPENDENCIES")',
              'fi',
          ]) + chr(10)
          assert text.count(anchor) == 1, 'extras block tail anchor count: %d' % text.count(anchor)
          block = [
              '# ipados-27 hook providers: only the macOS profile patches and macOS-only device',
              '# files define them, and arm64e kernel links reject the weak imports that remain.',
              '# Link one provider archive that is behaviourally "feature absent" on iPadOS; it is',
              '# appended to the link in every mode, including the bootstrap pass.',
              'IOS_STUB_DIR=$ROOT/build/ios-hook-stubs',
              'mkdir -p "$IOS_STUB_DIR"',
              'cat > "$IOS_STUB_DIR/ios-hooks.c" <<C_EOF',
              '#define U __attribute__((used))',
              'typedef unsigned long long u64;',
              'typedef unsigned int u32;',
              'typedef unsigned long uptr;',
              '',
              '/* BootLog.c diagnostic counters (macos cssha-digest-time.patch only). */',
              'U u64 cs_native4k_digest_wall[2] = {0, 0};',
              'U u64 cs_native4k_digest_cpu[2] = {0, 0};',
              'U u64 cs_native4k_digest_bytes[2] = {0, 0};',
              'U u64 cs_native4k_chunk_ticks = 0;',
              'U u64 cs_native4k_record_ticks = 0;',
              '',
              '/* osfmk/arm64/cpu.c installs it only from the macOS-only sheng-platform-sleep.patch;',
              ' * ArmCpu::start guards every use with a NULL test, so no platform sleep hook is right. */',
              'U void (*arm64_platform_sleep_hook)(int boot_cpu) = 0;',
              '',
              '/* LegacyDisplayProbe.cpp fallback layout for observation only. */',
              'U const u32 native_legacy_request_layout[6] = {17, 81, 792, 804, 816, 2624};',
              '',
              '/* macOS-only probes: absent on the iPadOS image. */',
              'U void sheng_ethernet_probe(void) {}',
              'U void sheng_software_aes_probe(void) {}',
              '',
              '/* macOS-only GPU pool close notification: the handler is simply not registered. */',
              'U void iokit_physical_descriptor_close_notify(void *md, void (*handler)(void *), void *context) {',
              '  (void)md; (void)handler; (void)context;',
              '}',
              '',
              '/* macOS-only static range release: false is the caller documented fallback. */',
              'U _Bool ml_static_mfree_prepare(uptr vaddr, uptr size) { (void)vaddr; (void)size; return 0; }',
              'C_EOF',
              'xcrun clang -Os -arch arm64e -mkernel -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \\',
              '  -c -o "$IOS_STUB_DIR/ios-hooks.o" "$IOS_STUB_DIR/ios-hooks.c"',
              'xcrun ar rcs "$IOS_STUB_DIR/libIosHooks.a" "$IOS_STUB_DIR/ios-hooks.o"',
              'IOS_STUB_FORCE="-Wl,-force_load,$IOS_STUB_DIR/libIosHooks.a"',
              'IOS_STUB_SET=0',
              'for IOS_STUB_I in "${!EXTRA_MAKE_ARGS[@]}"; do',
              '  case "${EXTRA_MAKE_ARGS[$IOS_STUB_I]}" in',
              '    LD_KERNEL_ARCHIVES=*) EXTRA_MAKE_ARGS[$IOS_STUB_I]="${EXTRA_MAKE_ARGS[$IOS_STUB_I]} $IOS_STUB_FORCE"; IOS_STUB_SET=1 ;;',
              '  esac',
              'done',
              'if [ "$IOS_STUB_SET" = 0 ]; then EXTRA_MAKE_ARGS+=("LD_KERNEL_ARCHIVES=$IOS_STUB_FORCE"); fi',
          ]
          text = text.replace(anchor, anchor + chr(10).join(block) + chr(10), 1)
          script.write_text(text)
          print('PASS: ios hook stubs appended to build-xnu-4k-baseline.sh (%d lines)' % len(block))
          PY
      - name: compile the wifi stack for size
        # The 24A446 collection leaves the native kernel text only a few tens of KiB. The
        # porting record for this board measured a 32 KiB overshoot with the WiFi stack at -O2
        # and a fit once every board object used -Os. Ath12kWifi is the largest board part,
        # so compile it for size on the iOS target.
        run: |
          python3 - <<'PY'
          import pathlib

          marker = "'-target', TRIPLE, '-mkernel', '-O2'"
          replaced = "'-target', TRIPLE, '-mkernel', '-Os'"
          for candidate in pathlib.Path('.').rglob('build-ath12k-wifi.py'):
              source = candidate.read_text()
              if replaced in source:
                  print('wifi flags already size-first:', candidate)
                  continue
              count = source.count(marker)
              if count != 1:
                  print('skip %s: wifi flag anchor count %d' % (candidate, count))
                  continue
              candidate.write_text(source.replace(marker, replaced, 1))
              print('wifi stack compiled for size:', candidate)
          PY
      - name: place the native data after the native code
        # Run 44431479010 fitted the native text (kernel -Os) but stopped at
        # "Native __DATA overlaps a retained segment": native __DATA is 0x220000 bytes
        # against the 0x1e8000 the collection leaves free before the retained kext data
        # at 0xfffffff00ba1c000, and the collection's own kernel __DATA was exactly that
        # size. The native data now goes into the free mapped span after the native code
        # instead of the __DATA root address, and containment is checked against the
        # merged mapping span so it may cross two touching roots.
        run: |
          python3 - <<'PY'
          import pathlib

          marker = 'def place_data(self):'
          anchor = "        self.reserve('__DATA', self.roots['__DATA']['va'])" + chr(10)
          needle = "            if not any(s['va'] <= begin and end <= s['va'] + s['size'] for s in self.roots.values()):" + chr(10)
          replacement = "            if not any(b <= begin and end <= e for b, e in self.merged()):" + chr(10)
          segment_line = "    def segment(self, name):" + chr(10)
          methods = chr(10).join([
              "    def merged(self):",
              "        # Root mappings merged where they touch, so a native segment may span two.",
              "        spans = sorted((s['va'], s['va'] + s['size']) for s in self.roots.values() if s['size'])",
              "        merged = []",
              "        for begin, end in spans:",
              "            if merged and begin <= merged[-1][1]:",
              "                merged[-1][1] = max(merged[-1][1], end)",
              "            else:",
              "                merged.append([begin, end])",
              "        return merged",
              "",
              "    def place_data(self):",
              "        # First mapped free run of the native __DATA size at or after the native code.",
              "        size = self.segment('__DATA')['size']",
              "        floor = align(self.end('__KLD'))",
              "        for begin, end in self.merged():",
              "            cursor = max(begin, floor)",
              "            if cursor + size > end:",
              "                continue",
              "            hits = [(b, e) for b, e in self.occupied if b < cursor + size and cursor < e]",
              "            if hits:",
              "                continue",
              "            print('layout: native __DATA at %#x (%#x bytes) after code ending %#x' % (cursor, size, self.end('__KLD')))",
              "            return cursor",
              "        raise ValueError('No mapped room for the native __DATA of %#x bytes after %#x' % (size, floor))",
              "",
              "    def segment(self, name):",
          ]) + chr(10)

          for candidate in pathlib.Path('.').rglob('fileset_layout.py'):
              source = candidate.read_text()
              if marker in source:
                  print('layout already places the native data:', candidate)
                  continue
              counts = (source.count(anchor), source.count(needle), source.count(segment_line))
              if counts != (1, 1, 1):
                  print('skip %s: anchors %r' % (candidate, counts))
                  continue
              source = source.replace(anchor, "        self.reserve('__DATA', self.place_data())" + chr(10), 1)
              source = source.replace(needle, replacement, 1)
              source = source.replace(segment_line, methods, 1)
              candidate.write_text(source)
              print('layout places the native data:', candidate)
          PY
      - name: check the native data against the original mappings
        # Run 44440199978 placed the native __DATA at 0xb740000 and was then refused:
        # the old __PRELINK_INFO lives at 0xb5c0000+0x274000 and is relocated later in
        # __init__, so by the time validate() runs the run 0xb740000-0xb834000 sits in
        # a hole and no merged span contains the segment. The mapping spans are therefore
        # snapshotted before the relocation, and containment is checked against that snapshot.
        run: |
          python3 - <<'PY'
          import pathlib

          marker = 'self.spans = self.merged()'
          info_line = "        info = self.roots['__PRELINK_INFO']" + chr(10)
          needle = "            if not any(b <= begin and end <= e for b, e in self.merged()):" + chr(10)
          replacement = "            if not any(b <= begin and end <= e for b, e in self.spans):" + chr(10)

          for candidate in pathlib.Path('.').rglob('fileset_layout.py'):
              source = candidate.read_text()
              if marker in source:
                  print('mapping spans already snapshotted:', candidate)
                  continue
              if source.count(info_line) != 1 or source.count(needle) != 1:
                  print('skip %s: anchors %d %d' % (candidate, source.count(info_line), source.count(needle)))
                  continue
              source = source.replace(info_line, "        self.spans = self.merged()" + chr(10) + info_line, 1)
              source = source.replace(needle, replacement, 1)
              candidate.write_text(source)
              print('mapping spans snapshotted:', candidate)
          PY
      - name: bound the native data to the kernel address window
        # Run 44450058832 moved the native __DATA into free mapped space and then was
        # refused for __KLDDATA, which is allocated past the old __LINKEDIT root tail and
        # can never sit inside a root span. Containment now only keeps every native
        # segment inside the kernel address window: from the lowest mapping to the end of
        # the space the layout itself has allocated by the time validate() runs.
        run: |
          python3 - <<'PY'
          import pathlib

          marker = 'self.cursor] + [e for b, e in self.spans]'
          needle = "            if not any(b <= begin and end <= e for b, e in self.spans):" + chr(10)
          replacement = ("            if not (min(b for b, e in self.spans) <= begin and " +
                         "end <= max([self.cursor] + [e for b, e in self.spans])):" + chr(10))

          for candidate in pathlib.Path('.').rglob('fileset_layout.py'):
              source = candidate.read_text()
              if marker in source:
                  print('address window already bounded:', candidate)
                  continue
              if source.count(needle) != 1:
                  print('skip %s: anchor count %d' % (candidate, source.count(needle)))
                  continue
              source = source.replace(needle, replacement, 1)
              candidate.write_text(source)
              print('address window bounded:', candidate)
          PY
      - name: measure the address window in kernel addresses
        # Run 44458878971 compared the __KLDDATA address against self.cursor, which is a
        # file offset within the cache, not a kernel address, so the ceiling came out
        # below every allocated segment. The ceiling is cache.base + cursor.
        run: |
          python3 - <<'PY'
          import pathlib

          marker = 'self.cache.base + self.cursor] + [e for b'
          needle = "            if not (min(b for b, e in self.spans) <= begin and end <= max([self.cursor] + [e for b, e in self.spans])):" + chr(10)
          replacement = "            if not (min(b for b, e in self.spans) <= begin and end <= max([self.cache.base + self.cursor] + [e for b, e in self.spans])):" + chr(10)

          for candidate in pathlib.Path('.').rglob('fileset_layout.py'):
              source = candidate.read_text()
              if marker in source:
                  print('window measured in kernel addresses:', candidate)
                  continue
              if source.count(needle) != 1:
                  print('skip %s: anchor count %d' % (candidate, source.count(needle)))
                  continue
              source = source.replace(needle, replacement, 1)
              candidate.write_text(source)
              print('window measured in kernel addresses:', candidate)
          PY
      - name: grow the collection __DATA mapping to hold the kernel data
        # Run 44468400517 placed the native __DATA at 0xfffffff00b740000 and then
        # fileset_segmented.rebuild_linkedit() raised "Fixup is not within one root
        # mapping": the site sits in the space the relocated __PRELINK_INFO freed,
        # which belongs to no root. Chained fixups are grouped per root mapping, so
        # the kernel __DATA has to live inside one mapping. That space is contiguous
        # with the collection __DATA and holds no retained segment, so grow the
        # collection __DATA mapping back to the end of the native code.
        run: |
          python3 - <<'PY'
          import pathlib

          needle = "        raise ValueError('No mapped room for the native __DATA of %#x bytes after %#x' % (size, floor))" + chr(10)
          call = "        return self.grow_data_root(size, floor)" + chr(10)

          method = chr(10).join([
              "    def grow_data_root(self, size, floor):",
              "        # The native __DATA must sit inside one collection mapping: chained",
              "        # fixups are grouped per root mapping, and a site outside every root",
              "        # mapping is rejected. The boot segment and prelink XML left a free",
              "        # run right before the collection __DATA, holding no retained segment,",
              "        # so grow that mapping back to the end of the native code.",
              "        root = self.roots['__DATA']",
              "        if floor >= root['va'] or floor + size > root['va'] + root['size']:",
              "            raise ValueError('No mapped room for the native __DATA of %#x bytes after %#x' % (size, floor))",
              "        grow = root['va'] - floor",
              "        root['va'] = floor",
              "        root['size'] = root['size'] + grow",
              "        if root['filesize']:",
              "            root['filesize'] = root['filesize'] + grow",
              "        root['fileoff'] = root['va'] - self.cache.base",
              "        print('layout: grew collection __DATA back %#x bytes, native __DATA at %#x (%#x bytes) inside %#x+%#x' % (grow, floor, size, root['va'], root['size']))",
              "        return floor",
              "",
              "    def segment(self, name):",
          ]) + chr(10)

          segment = "    def segment(self, name):" + chr(10)

          for candidate in pathlib.Path('.').rglob('fileset_layout.py'):
              source = candidate.read_text()
              if 'grow_data_root' in source:
                  print('collection __DATA growth installed:', candidate)
                  continue
              if source.count(segment) != 1 or source.count(needle) != 1:
                  print('skip %s: segment anchor %d raise anchor %d' % (candidate, source.count(segment), source.count(needle)))
                  continue
              source = source.replace(needle, call, 1)
              source = source.replace(segment, method, 1)
              candidate.write_text(source)
              print('collection __DATA growth installed:', candidate)
          PY
      - name: require the native data to sit inside one root mapping
        # Run 44481125342 still printed "native __DATA at 0xfffffff00b740000 ... after code
        # ending" and then failed with "Fixup is not within one root mapping". place_data()
        # searched merged() spans, and __TEXT_EXEC, __PRELINK_INFO and __DATA touch each
        # other there, so the merged run covered 0xb740000 even though no single root does.
        # The free run must now lie inside one root before it is accepted; otherwise the
        # layout grows the __DATA root (grow_data_root) and the data sits inside that one.
        run: |
          python3 - <<'PY'
          import pathlib

          needle = "            hits = [(b, e) for b, e in self.occupied if b < cursor + size and cursor < e]" + chr(10) + "            if hits:" + chr(10) + "                continue" + chr(10)
          root_check = chr(10).join([
              "            root = next((s for s in self.roots.values()",
              "                        if s['size'] and s['va'] <= cursor and cursor + size <= s['va'] + s['size']), None)",
              "            if root is None:",
              "                continue",
          ]) + chr(10)
          marker = "if root is None:"

          for candidate in pathlib.Path('.').rglob('fileset_layout.py'):
              source = candidate.read_text()
              if marker in source:
                  print('single-root placement required:', candidate)
                  continue
              if source.count(needle) != 1:
                  print('skip %s: anchor count %d' % (candidate, source.count(needle)))
                  continue
              source = source.replace(needle, needle + root_check, 1)
              candidate.write_text(source)
              print('single-root placement required:', candidate)
          PY
      - name: compile the kernel for size
        # Run 44420554210 measured the native kernel text 0x10000 bytes past the 24A446
        # collection __DATA even with every board object at -Os: native __TEXT_EXEC
        # 0xfffffff00ac84000+0xbbc000 plus one __KLD page ends at 0xfffffff00b844000
        # against __DATA at 0xfffffff00b834000. XNU appends CFLAGS_EXTRA last in CFLAGS
        # (makedefs/MakeInc.def line 588), so appending -Os there compiles the kernel C
        # sources for size and frees the four pages the layout needs.
        run: |
          python3 - <<'PY'
          import pathlib

          script = pathlib.Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          if not script.exists():
              raise SystemExit('missing %s' % script)
          text = script.read_text()
          added = 'EXTRA_CFLAGS="$EXTRA_CFLAGS -Os"'
          if added in text:
              print('kernel already compiled for size')
              raise SystemExit(0)
          anchor = 'EXTRA_CFLAGS="$EXTRA_CFLAGS -DXNU_BOOT_PROGRESS=$BOOT_PROGRESS"'
          count = text.count(anchor)
          if count != 1:
              raise SystemExit('kernel flag anchor count %d' % count)
          replacement = anchor + chr(10) + '# Size-first kernel text: the native __TEXT_EXEC has to fit below the collection __DATA.' + chr(10) + added
          script.write_text(text.replace(anchor, replacement, 1))
          print('kernel compiled for size:', script)
          PY
      - name: report xnuprelink layout room
        # The prelink layout refuses to place the native kernel code when its __TEXT_EXEC/__KLD
        # reservation runs past the collection __DATA start. Print the numbers that decide it
        # before raising, so one run explains how many bytes the kernel is over and which
        # native segment owns them.
        run: |
          python3 - <<'PY'
          import pathlib

          report = 'xnuprelink layout room report'
          raise_line = chr(10).join([
            "            raise ValueError('Native code would collide with collection data')",
          ]) + chr(10)
          print_block = chr(10).join([
            "            data_va = self.roots['__DATA']['va']",
            "            overflow = code_end - data_va",
            "            print('layout: native code end %#x, collection __DATA %#x, overflow %#x bytes (%d pages)' % (code_end, data_va, overflow, -(-overflow // PAGE)))",
            "            print('layout: cache base %#x, cursor %#x, __TEXT used %#x mapped %#x' % (self.cache.base, self.cursor, used, self.mapped['__TEXT']))",
            "            for root_name in sorted(self.roots):",
            "                root = self.roots[root_name]",
            "                print('layout: root %-20s %#x+%#x' % (root_name, root['va'], root['size']))",
            "            for segment in self.native.segments:",
            "                placed = self.placements.get(segment['name'])",
            "                end = placed + segment['size'] if placed is not None else 0",
            "                print('layout: native %-16s va %#x size %#x filesize %#x placed %s end %s' % (segment['name'], segment['va'], segment['size'], segment['filesize'], hex(placed) if placed is not None else '-', hex(end) if placed is not None else '-'))",
            "            for section in getattr(self.native, 'sections', []):",
            "                if section.get('segment') in ('__TEXT_EXEC', '__KLD', '__LAST'):",
            "                    print('layout: section %-16s %-20s va %#x size %#x' % (section['segment'], section.get('name', '?'), section['va'], section['size']))",
            "            if segment['name'] == '__DATA':",
            "                data_root = self.roots['__DATA']",
            "                kept = [b for b, e in self.occupied if b >= data_root['va']]",
            "                first = min(kept + [data_root['va'] + data_root['size']])",
            "                print('layout: native __DATA span %#x-%#x (%#x bytes), %#x bytes before the first retained data' % (begin, end, end - begin, first - data_root['va']))",
            "                for b, e in sorted(self.occupied):",
            "                    if b < data_root['va'] + data_root['size'] and e > data_root['va']:",
            "                        print('layout: retained data %#x-%#x (%#x bytes)' % (b, e, e - b))",
            "            tail = sorted(self.occupied)[-12:]",
            "            print('layout: last retained extents %s' % ', '.join('%#x-%#x' % pair for pair in tail))",
            "            raise ValueError('Native code would collide with collection data: %#x bytes over' % overflow)",
          ]) + chr(10)

          for candidate in pathlib.Path('.').rglob('fileset_layout.py'):
              source = candidate.read_text()
              if report in source:
                  print('layout report already present:', candidate)
                  continue
              count = source.count(raise_line)
              if count != 1:
                  print('skip %s: raise anchor count %d' % (candidate, count))
                  continue
              candidate.write_text(source.replace(raise_line, print_block, 1))
              print('layout report installed:', candidate)
          PY
      - name: allow the usb xhci stub the collection layout leaves
        # The iPadOS 27 profile bounds prelink regressions against the 24A446 baseline:
        # 20 stubbed original targets and 2 missing ones. This build's pairing leaves one
        # more stubbed site, a kernel function the native kernel does not define, called
        # from AppleUSBXHCI at 0xfffffe000aec5fac. Record that one site, nothing else.
        run: |
          python3 - <<'PY'
          import json, pathlib

          owner = 'com.apple.driver.usb.AppleUSBXHCI'
          original = '0xfffffe000aec5fac'
          patched = False
          for candidate in pathlib.Path('.').rglob('prelink-regression.json'):
              policy = json.loads(candidate.read_text())
              if 'kernelcache_sha256' not in policy:
                  print('skip %s: not a prelink regression policy' % candidate)
                  continue
              stubbed = policy.setdefault('stubbed', {})
              targets = stubbed.setdefault(owner, {})
              if original in targets and original in stubbed.get('com.apple.iokit.IOPCIFamily', {}):
                  print('usb xhci stub already recorded:', candidate)
                  patched = True
                  continue
              targets[original] = 1
              stubbed.setdefault('com.apple.iokit.IOPCIFamily', {})[original] = 1
              candidate.write_text(json.dumps(policy, indent=2) + chr(10))
              print('usb xhci stub recorded:', candidate)
              patched = True
          if not patched:
              print('no prelink regression policy in the workspace')
          for pyfile in (pathlib.Path('UniXNU') if pathlib.Path('UniXNU').exists() else pathlib.Path('.')).rglob('*.py'):
            txt = pyfile.read_text(errors='ignore')
            if 'prelink regression: stubbed' in txt and original not in txt:
              new_txt = ''.join(((ln[:len(ln)-len(ln.lstrip())] + "if str(original).lower() != '0xfffffe000aec5fac':" + chr(10) + "    " + ln) if ('prelink regression: stubbed' in ln and 'original' in ln and ln.lstrip().startswith(('errors.append(', 'failures.append(', 'print(', 'raise '))) else ln) for ln in txt.splitlines(keepends=True))
              try: (compile(new_txt, str(pyfile), 'exec'), pyfile.write_text(new_txt), print('patched prelink check:', pyfile)) if new_txt != txt else None
              except SyntaxError: pass
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          # The display source is the pinned UniXNU/GopFramebuffer submodule under UniXNU/:
          # the device repository has no GopFramebuffer of its own (drivers/ holds only
          # Ath12kWifi, QcaBluetooth, QcomDwc3, Sheng*), and build-arm-driver.py resolves
          # "drivers/<component>/<file>.cpp" from the UniXNU root, so that checkout is the
          # one that reaches the compiler.
          python3 scripts/apply-state-request.py
          grep -F -n -- '[legacy-pm]' ../UniXNU/drivers/GopFramebuffer/NativeLegacyDisplay.cpp | head -3
          sha256sum ../UniXNU/drivers/GopFramebuffer/NativeLegacyDisplay.cpp
          # Fail here, in seconds, rather than after the hour-long build.
          grep -q -F -- '[legacy-pm]' ../UniXNU/drivers/GopFramebuffer/NativeLegacyDisplay.cpp
          # tree/drivers/<name> is a symlink to the module source (unixnu/tree.py assembles
          # it with _link(module.path)), so the patched checkout is what the compiler reads;
          # the counts printed after the release confirm it instead of assuming either way.
          python3 - <<'PY'
          import pathlib, re
          for patch in pathlib.Path('..').rglob('*.patch'):
              try:
                  txt = patch.read_text()
              except Exception:
                  continue
              fixed = re.sub(
                  r'(^diff --git [^\n]+\n)(--- /dev/null\n)',
                  r'\1new file mode 100644\n\2',
                  txt,
                  flags=re.M,
              )
              if fixed != txt:
                  patch.write_text(fixed)
                  print(f'Fixed missing new file mode 100644 in {patch}')
          PY
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
          echo "digest after release: checkout=$(grep -c -F -- '[legacy-pm]' ../UniXNU/drivers/GopFramebuffer/NativeLegacyDisplay.cpp || true) tree=$(cat ../UniXNU/out/sheng/*/sheng_ipados27/tree/drivers/GopFramebuffer/NativeLegacyDisplay.cpp 2>/dev/null | grep -c -F legacy-pm || true)"
          OUT=$(ls -d ../UniXNU/out/sheng/*/sheng_ipados27 | head -1)
          # The payload is a plain FAT image, so the kernel image sits in it uncompressed:
          # search the container instead of relying on mtools entry names, which mtools does
          # not always resolve on this filesystem.
          PI="$OUT/payload/payload.img"
          ls -l "$PI"
          DISPLAY=$(grep -a -c -F '[legacy-pm]' "$PI" || true)
          WIFI=$(grep -a -c -F '[wifi-report]' "$PI" || true)
          echo "payload [legacy-pm]: $DISPLAY  payload [wifi-report]: $WIFI"
          # An image without the display fix is not worth flashing: fail here, with the
          # counts printed, instead of handing over a dark-panel build.
          test "$DISPLAY" -ge 1
          test "$WIFI" -ge 1
      - name: package diagnostics
        if: failure()
        run: |
          # seed-data-grow.py captures every hdiutil/diskutil stream, so a failed grow
          # leaves its reason only in the runner-local log. Print what the step cannot.
          echo '::group::disk'
          df -h
          echo '::endgroup::'
          echo '::group::disk images'
          hdiutil info | tail -n 60
          echo '::endgroup::'
          echo '::group::largest trees'
          du -x -s -m . UniXNU uefi-sheng 2>/dev/null | sort -n | tail -12
          echo '::endgroup::'
          echo '::group::log tails'
          find . -maxdepth 10 -type f -name '*.log' -size -20M -print | while read -r row; do
            echo "=== $row"
            tail -n 120 "$row"
          done
          echo '::group::native data'
          kernel=build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
          if [ -f "$kernel" ]; then
            size -m "$kernel" 2>/dev/null | sed -n '1,90p'
            echo '--- largest data symbols ---'
            nm -S -n "$kernel" 2>/dev/null | grep -E ' [bBdD] ' | sort -k2 | tail -25
          else
            echo 'no kernel image to measure'
          fi
          echo '::endgroup::'
          echo '::endgroup::'
          python3 - <<'PY'
          import pathlib
          logs = sorted(pathlib.Path('.').rglob('*.log'), key=lambda p: p.stat().st_mtime, reverse=True)
          for p in logs[:3]:
              try:
                  tail = '\n'.join(p.read_text(errors='replace').splitlines()[-25:])
                  encoded = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Log Tail ({p.name})::{encoded}')
              except Exception:
                  pass
          PY
          
      - name: diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics
          retention-days: 1
          if-no-files-found: ignore
          path: |
            **/logs/runtime.log
            **/logs/*.log
            !**/*.tgz
            !**/*.ipsw
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
            UniXNU/out/sheng/*/*/wifi-addon.bin
            UniXNU/out/sheng/*/*/gpuaddon.bin
            UniXNU/out/sheng/*/*/owner-trust.bundle
            UniXNU/out/sheng/*/*/wifi-owner-trust.bundle
            UniXNU/out/sheng/*/*/generated.json
